name: Custom GPT Defect
description: Report a reproducible TikTok Shop Product Video Director defect.
title: "[Defect]: "
labels:
  - defect
body:
  - type: markdown
    attributes:
      value: |
        Use this for defects only. Feature requests should use the feature request template.
  - type: input
    id: gpt_version
    attributes:
      label: GPT version
      description: Custom GPT version or release name.
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Original Prompt
      description: Paste the exact prompt used.
    validations:
      required: true
  - type: textarea
    id: complete_output
    attributes:
      label: Complete Output
      description: Paste the full GPT output, not only the failing excerpt.
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result
    validations:
      required: true
  - type: textarea
    id: actual_result
    attributes:
      label: Actual Result
    validations:
      required: true
  - type: input
    id: test_case_id
    attributes:
      label: Test Case ID
      description: Existing test case ID or manual case ID.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Files
      description: Attach screenshots or generated files if available.
    validations:
      required: false
  - type: input
    id: reproduction_count
    attributes:
      label: Reproduction Count
      description: Number of times reproduced.
    validations:
      required: true
  - type: dropdown
    id: truth_safety_risk
    attributes:
      label: Safety / Truth Risk
      options:
        - Product Truth risk
        - Safety or claim risk
        - Routing risk
        - Delivery format risk
        - No known safety/truth risk
    validations:
      required: true
*** Add File: .github/ISSUE_TEMPLATE/feature-request.yml
name: Feature Request
description: Request a new capability that is not a defect.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this only for new capability requests. If current behavior violates an existing contract, use Custom GPT Defect.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Opportunity
      description: What user or workflow need does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposed_behavior
    attributes:
      label: Proposed Behavior
      description: Describe the desired behavior without assuming implementation details.
    validations:
      required: true
  - type: textarea
    id: why_not_defect
    attributes:
      label: Why this is not a defect
      description: Explain why current behavior does not violate an existing approved contract.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Custom GPT routing
        - Knowledge/Product Pack
        - Builder workflow
        - Backend Action
        - Testing or release process
        - Other
    validations:
      required: true
